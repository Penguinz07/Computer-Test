<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity</title>
    <link rel="stylesheet" href="../Computer%20Components/styles.css">
</head>
<body>
    <button class="back" type="button">Back</button>
    <main>
        <h1 id="page-title">Match.</h1>
        <p class="intro" id="instructions">Match each electricity term to its description.</p>

        <section class="match-board" aria-label="Match electricity terms to their descriptions">
            <div class="column-title">Questions</div>
            <div class="column-title">Answers</div>
        </section>
        <section class="true-false" id="true-false" aria-label="True or false questions" hidden>
            <p class="column-title" id="question-progress"></p>
            <p class="statement" id="statement"></p>
            <div class="true-false-options" id="true-false-options">
                <button class="true-false-option" type="button" data-choice="True">True</button>
                <button class="true-false-option" type="button" data-choice="False">False</button>
            </div>
        </section>
        <section class="multiple-choice" id="multiple-choice" aria-label="Multiple-choice questions" hidden>
            <p class="column-title" id="mcq-progress"></p>
            <p class="statement" id="mcq-question"></p>
            <div class="multiple-choice-options" id="mcq-options"></div>
        </section>
        <p class="status" id="status" aria-live="polite">Select a question to get started.</p>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
